name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:content
      - run: pnpm check:release
      - run: pnpm real-world:check
      - run: pnpm check:secrets
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm benchmark
      - run: pnpm benchmark:checks
      - run: pnpm build
      - run: pnpm audit
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e --max-failures=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minsk-browser-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
